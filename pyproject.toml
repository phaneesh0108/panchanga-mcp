[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "panchanga-mcp"
version = "0.1.0"
description = "MCP server that serves the daily Panchanga from the Panchanga API"
requires-python = ">=3.10"
dependencies = ["mcp>=1.2.0,<2", "httpx>=0.27"]

[project.scripts]
panchanga-mcp = "panchanga_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/panchanga_mcp"]
